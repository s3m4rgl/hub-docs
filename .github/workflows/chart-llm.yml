name: Chart LLM checks

# Блок llm: чарта security-scan-hub: helm lint и рендер фикстур
# charts/security-scan-hub/tests/llm (включая ожидаемые ошибки валидации).
# helm и yq есть в образе ubuntu-latest.

on:
  push:
    branches: [main]
    paths: [charts/**, scripts/check-chart-llm.sh, .github/workflows/chart-llm.yml]
  pull_request:
    paths: [charts/**, scripts/check-chart-llm.sh, .github/workflows/chart-llm.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-chart-llm.sh
