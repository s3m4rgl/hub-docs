## OWASP ZAP — постоянно работающий daemon для активного сканирования веб-приложений.
##
## Архитектура:
##   - StatefulSet с одной репликой (образ zaproxy/zap-stable, режим daemon).
##   - Слушает TCP 8090; клиенты (DomainScope) аутентифицируются через X-ZAP-API-Key.
##   - PVC в /home/zap/.ZAP хранит сессии, контексты и политики сканирования между рестартами.
##   - Опциональный ingress для веб-интерфейса (у zap2docker нет встроенного UI;
##     ingress здесь открывает API для инструментов вроде zaproxy/zap-cli вне k8s).
##
## Egress:
##   - Исходящий трафик сканирования (атаки ZAP по целям) идёт через sidecar WireGuard
##     при wireguard.enabled=true. См. scripts/wg/ и docs/wireguard.md.

nameOverride: ""
fullnameOverride: ""

## --- Чувствительные значения ---
secrets:
  create: true
  existingSecretName: ""
  ## API-ключ ZAP. Пустое = генерируется случайно при первой установке (сохраняется при апгрейдах).
  apiKey: ""

## --- Контекст безопасности пода ---
##
## fsGroup здесь ОБЯЗАТЕЛЕН, а не украшение. Ниже объявлен volumeClaimTemplates,
## том монтируется в /home/zap/.ZAP, а процесс ZAP работает под uid 1000
## (проверено: `docker run --rm --entrypoint id zaproxy/zap-stable@<digest>`
## отвечает `uid=1000(zap) gid=1000(zap)`). Без fsGroup kubelet не меняет
## владельца тома, у обычного CSI он приезжает как root:root 0755, и ZAP падает
## с "The home path is not writable: /home/zap/.ZAP/" в CrashLoopBackOff.
##
## На k3s дефект НЕ воспроизводится: его local-path provisioner создаёт каталог
## с правами 0777. Поэтому проверка на k3s такую поломку не ловит — она видна
## только у клиентов на обычном CSI.
##
## Пустое значение ({}) отключает секцию целиком — на случай, если
## PodSecurityPolicy/Kyverno навязывает собственный контекст.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

image:
  repository: zaproxy/zap-stable
  ## ZAP не публикует версионных тегов — пинимся на digest для воспроизводимости
  ## (фиксирует конкретный образ, не плавающий latest). Обновлять при апгрейде ZAP:
  ##   docker buildx imagetools inspect zaproxy/zap-stable:latest
  ## digest имеет приоритет над tag (см. statefulset.yaml). Сбросить на latest:
  ## задайте digest: "" .
  tag: latest
  digest: "sha256:7c2f8afc893e4e4000be8ad3fd22013fc36e5cce59359349f5a2d45626e2ccb9"
  pullPolicy: IfNotPresent

## Порт прослушивания daemon ZAP (внутри контейнера; service пробрасывает тот же порт).
port: 8090

## --- Лимиты ресурсов daemon ---
##
## ZAP может потреблять гигабайты heap при активных сканах. Настройте под свою нагрузку.
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "4000m"
    memory: "4Gi"

## --- Хранилище для сессий, контекстов, политик сканирования ---
storage:
  size: 10Gi
  storageClassName: ""   # "" = кластерный default storageclass (портируемо); задайте свой для конкретного CSI

## --- Service ---
service:
  type: ClusterIP
  port: 8090

## --- Ingress (опционально — открывает API для внешних инструментов) ---
##
## У daemon ZAP НЕТ встроенного UI. Ingress здесь полезен, если вы хотите
## направить десктоп-клиент ZAP на инстанс в кластере. Для интеграции с
## DomainScope ingress НЕ нужен (всё работает внутри кластера).
ingress:
  enabled: false
  className: traefik
  host: zap.example.com
  proxyBodySize: "100m"
  proxyReadTimeout: "600"
  traefikEntrypoints: "web,websecure"
  extraAnnotations: {}

tls:
  mode: selfsigned
  issuer: ""
  existingSecretName: ""

## --- WireGuard egress ---
wireguard:
  enabled: false
  existingSecretName: ""
  privateKey: ""
  serverPublicKey: ""
  serverEndpoint: ""
  podIp: "10.200.0.4/32"
  ## CIDR'ы service и pod кластера, которые должны оставаться на шлюзе по умолчанию.
  ## Значения по умолчанию соответствуют k3s; при необходимости переопределите для не-k3s кластеров.
  serviceCidr: "10.43.0.0/16"
  podCidr: "10.42.0.0/16"
  ## Дополнительные подсети, которые должны ходить мимо туннеля, через обычный
  ## шлюз пода. Внутрикластерные CIDR, приватные диапазоны RFC1918 и IP ноды
  ## (через downward API) исключаются автоматически — сюда добавляйте только
  ## то, что сверх этого.
  keepOnDefaultGw: []
  ## Подсеть самого туннеля (WG_NETWORK из scripts/wg/1-setup-server.sh).
  ## Маршрутизируется в wg0 явно: иначе она попадает под общее правило
  ## 10.0.0.0/8 → шлюз и WG-сервер недоступен по внутреннему адресу.
  tunnelCidr: "10.200.0.0/24"
  ## Подсети, которые нужно гнать В туннель вопреки правилам выше. Главный
  ## случай — сканирование внутреннего периметра клиента: цели в RFC1918,
  ## достижимые только со стороны WG-сервера. Без этого они уходили бы
  ## в локальный шлюз кластера и сканирование молча било мимо.
  ##   routeViaTunnel: ["10.5.0.0/16", "192.168.100.0/24"]
  routeViaTunnel: []
  ## MTU интерфейса wg0. 1420 подходит для IPv4-эндпоинта поверх Ethernet 1500.
  ## Уменьшите, если туннель идёт поверх ещё одного оверлея.
  mtu: 1420
  ## Образ init-контейнера, поднимающего туннель. Нужны wireguard-tools и
  ## iproute2 внутри. Раньше здесь был alpine + `apk add` на каждом старте —
  ## это требовало доступа к репозиториям Alpine и падало при закрытом egress.
  image:
    repository: procustodibus/wireguard
    tag: latest
    digest: "sha256:36047281c7fd047f46940a5786a21712811218ba606c7d30ec3d3caf9095cca8"
    pullPolicy: IfNotPresent

## Параметры JVM демона ZAP. Передаются АРГУМЕНТОМ zap.sh (не через env
## JAVA_OPTS — его zap.sh не читает вообще).
##
## ВАЖНО: без явного -Xmx zap.sh берёт 1/4 от /proc/meminfo, то есть от памяти
## НОДЫ, а не от resources.limits.memory: его детект cgroup-лимита смотрит
## только в cgroup v1 (/sys/fs/cgroup/memory/memory.stat), которого на cgroup v2
## (Ubuntu 22.04+, современный k3s) не существует. На ноде 32 ГБ с лимитом 4Gi
## это давало -Xmx8020m — вдвое больше лимита, то есть гарантированный OOMKill.
##
## Держите значение ≤ ~75% от resources.limits.memory.
jvmOpts: "-Xmx2g"

## Проверять ли обновления ZAP и аддонов при старте.
##
## true (по умолчанию): на пустом PVC ZAP докачивает ~25 аддонов (~60 с при
## быстром канале) и далее обновляет их при каждом рестарте. Свежие правила
## сканирования, но нужен egress на zaproxy.org и первый старт долгий.
##
## false: строго то, что запечено в образ. Обязательно для air-gapped-контуров;
## также делает результаты сканов воспроизводимыми — иначе pin образа по digest
## обесценивается плавающими версиями аддонов.
checkForUpdates: true

## Бюджет времени на холодный старт. Пока startupProbe не прошла, liveness не
## считается, поэтому долгая докачка аддонов не может убить под рестартом.
## failureThreshold × periodSeconds(10s) = предельное время старта.
startupProbe:
  failureThreshold: 60   # 60 × 10 с = 10 минут
